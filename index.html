<!-- 사람(2장) 패널 — 5주 웹 페이지를 통째로 전체화면으로. 시선(4주) 마지막 슬라이드에서 한 번 더 아래로 굴리면 올라오고,
     이 페이지 맨 위에서 위로 굴리면 다시 시선으로 돌아간다. 전환 로직은 아래 스크립트 -->

<!-- 공간(3장) 패널 — 입체 좌우 스크롤(coverflow). 사람 맨 아래에서 한 번 더 아래로 굴리면 올라오고,
     공간 맨 왼쪽에서 위로 굴리면 다시 사람으로. 전환 로직은 아래 스크립트 -->

    <button type="button" class="viewer__nav viewer__nav--prev" id="viewer-prev"><span class="visually-hidden">previous</span></button>
    <button type="button" class="viewer__nav viewer__nav--next" id="viewer-next"><span class="visually-hidden">next</span></button>
    <button type="button" class="viewer__close" id="viewer-close"><span class="visually-hidden">close</span></button>
  </div>
  <p class="viewer__caption" id="viewer-caption"></p>
  <div class="viewer__strip" id="viewer-strip"></div>

<script>
(function () {
  "use strict";

  var stage  = document.getElementById("stage");
  var left   = document.getElementById("track-left");
  var right  = document.getElementById("track-right");
  var axis   = [].slice.call(document.querySelectorAll(".axis__item"));
  var lSlides = [].slice.call(left.children);
  var rSlides = [].slice.call(right.children);
  var n = lSlides.length;

  var viewer  = document.getElementById("viewer");
  var vImg    = document.getElementById("viewer-img");
  var vCap    = document.getElementById("viewer-caption");
  var vStrip  = document.getElementById("viewer-strip");
  var btnPrev = document.getElementById("viewer-prev");
  var btnNext = document.getElementById("viewer-next");
  var btnClose= document.getElementById("viewer-close");

  /* ---------- 분할 이동 — 왼쪽은 위로, 오른쪽은 아래로 ----------
     휠 입력을 target 에 쌓고, pos 가 매 프레임 따라간다. 입력이 멈추면 한 쌍에 스냅한다.
     한 번에 한 칸씩 잠그는 방식보다 마우스로 훑을 때 걸리는 느낌이 없다 */

  var WHEEL_STEP = 700;   // 휠 델타 얼마를 한 화면으로 볼지
  var FOLLOW     = 0.16;  // pos 가 target 을 따라가는 비율 (한 칸이 약 .5s — --dur-image 와 맞춤)
  var SNAP_WAIT  = 130;   // 입력이 멈춘 뒤 스냅까지 (ms)
  var SNAP_MIN   = 0.12;  // 이만큼만 밀어도 한 화면 넘긴다 (휠 한 칸 = 약 0.17)

  var target = 0;         // 가고 싶은 위치 (실수)
  var pos    = 0;         // 지금 위치 (실수)
  var shown  = -1;        // 마지막으로 반영한 정수 화면
  var anchor = 0;         // 이번 휠 동작을 시작한 화면
  var moving = false;     // 휠 동작 중인지
  var snapTimer = null;

  function apply() {
    left.style.transform  = "translate3d(0, " + (-pos * 100) + "vh, 0)";
    right.style.transform = "translate3d(0, " + (-(n - 1 - pos) * 100) + "vh, 0)";

    var i = Math.round(pos);
    if (i === shown) return;
    shown = i;

    document.body.dataset.inverted = lSlides[i].dataset.invert;

    var group = lSlides[i].dataset.group;
    axis.forEach(function (b) {
      b.setAttribute("aria-current", lSlides[Number(b.dataset.jump)].dataset.group === group ? "true" : "false");
    });

    [i - 1, i + 1].forEach(function (k) {            // 다음·이전 화면 사진을 미리 불러 둔다
      if (k < 0 || k >= n) return;
      [lSlides[k], rSlides[k]].forEach(function (s) {
        var img = s.querySelector("img");
        if (img) img.loading = "eager";
      });
    });

    cursor();
  }

  var raf = null;

  function settle() { pos = target; apply(); }

  function loop() {
    var d = target - pos;
    if (Math.abs(d) < 0.0008) { settle(); raf = null; return; }
    pos += d * FOLLOW;
    apply();
    raf = requestAnimationFrame(loop);
  }

  // 탭이 뒤에 있으면 rAF 가 돌지 않는다. 그때는 애니메이션 없이 바로 맞춘다
  function run() {
    if (document.hidden) { settle(); return; }
    if (raf === null) raf = requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", function () {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
    run();
  });

  function clamp(v) { return Math.max(0, Math.min(n - 1, v)); }

  function nudge(delta) {
    if (!moving) { anchor = Math.round(pos); moving = true; }
    target = clamp(target + delta);
    clearTimeout(snapTimer);
    snapTimer = setTimeout(snap, SNAP_WAIT);
    run();
  }

  // 밀어 둔 만큼을 화면 단위로 끊는다. 살짝만 밀어도(SNAP_MIN) 한 칸은 넘어간다
  function snap() {
    var d = target - anchor;
    var step = 0;
    if (Math.abs(d) >= SNAP_MIN) {
      step = Math.max(1, Math.round(Math.abs(d))) * (d > 0 ? 1 : -1);
    }
    target = clamp(anchor + step);
    moving = false;
    run();
  }

  function go(next) {                                 // 정해진 화면으로 (축 라벨·키보드)
    clearTimeout(snapTimer);
    moving = false;
    target = clamp(Math.round(next));
    run();
  }

  /* ---------- 패널 전환: 시선(0) ↔ 사람(1) ↔ 공간(2) ----------
     시선 마지막 슬라이드에서 한 번 더 아래 → 사람. 사람 맨 위에서 위 → 시선.
     사람 맨 아래에서 한 번 더 아래 → 공간. 공간 맨 왼쪽에서 위 → 사람.
     상단 메뉴(시선·사람·공간) 클릭으로도 바로 이동. */
  var person = document.getElementById("person");
  var pframe = document.getElementById("person-frame");
  var space  = document.getElementById("space");
  var sframe = document.getElementById("space-frame");
  var panel  = 0;          // 0 시선 · 1 사람 · 2 공간
  var ovUp = 0, ovDn = 0;  // 경계에서 더 굴린 양
  var PANEL_TRIG = 120;    // 이만큼 더 굴리면 넘어간다 ("한 번 더")

  // 사람 히어로 '김동은' 손글씨 쓰이는 효과 재생/정리
  function playWrite(on) {
    try {
      var html = pframe.contentDocument && pframe.contentDocument.documentElement;
      if (!html) return;
      html.classList.remove("play-write");
      if (on) { void html.offsetWidth; html.classList.add("play-write"); }
    } catch (e) {}
  }
  // 공간에 들어올 때 맨 왼쪽(첫 칸)에서 시작
  function resetSpace() {
    try { var sc = sframe.contentDocument.getElementById("s3"); if (sc) sc.scrollLeft = 0; } catch (e) {}
  }

  function setPanel(nn) {
    if (nn === panel) return;
    panel = nn; ovUp = 0; ovDn = 0;
    person.classList.toggle("is-on", nn >= 1);
    space.classList.toggle("is-on", nn >= 2);
    playWrite(nn === 1);
    if (nn === 2) resetSpace();
  }

  // 사람 페이지(iframe) 스크롤 경계: 맨 위에서 위 → 시선 · 맨 아래에서 아래 → 공간
  pframe.addEventListener("load", function () {
    try {
      var pwin = pframe.contentWindow, pdoc = pframe.contentDocument;
      pwin.addEventListener("wheel", function (e) {
        if (panel !== 1) return;
        var el = pdoc.scrollingElement || pdoc.documentElement;
        var top = el.scrollTop;
        var bottom = top + el.clientHeight >= el.scrollHeight - 2;
        if (e.deltaY < 0 && top <= 0) { ovUp += -e.deltaY; ovDn = 0; if (ovUp > PANEL_TRIG) setPanel(0); }
        else if (e.deltaY > 0 && bottom) { ovDn += e.deltaY; ovUp = 0; if (ovDn > PANEL_TRIG) setPanel(2); }
        else { ovUp = 0; ovDn = 0; }
      }, { passive: true });
    } catch (err) {}
  });

  // 공간 페이지(iframe) 맨 왼쪽에서 위로 굴리면 사람으로
  sframe.addEventListener("load", function () {
    try {
      var swin = sframe.contentWindow, sdoc = sframe.contentDocument;
      var sc = sdoc.getElementById("s3");
      swin.addEventListener("wheel", function (e) {
        if (panel !== 2) return;
        var unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1;
        var dy = e.deltaY * unit;
        if (dy < 0 && sc && sc.scrollLeft <= 0) { ovUp += -dy; if (ovUp > PANEL_TRIG) setPanel(1); }
        else ovUp = 0;
      }, { passive: true, capture: true });
    } catch (err) {}
  });

  // 시선(0)에서만 분할 무대가 휠을 받는다. 마지막 슬라이드에서 한 번 더 아래 → 사람
  window.addEventListener("wheel", function (e) {
    if (viewer.dataset.open === "true") return;
    if (panel !== 0) return;            // 사람·공간에선 각 iframe 이 휠을 처리
    e.preventDefault();
    if (e.deltaY > 0 && Math.round(pos) >= n - 1 && Math.abs(target - (n - 1)) < 0.02) {
      ovDn += e.deltaY;
      if (ovDn > PANEL_TRIG) setPanel(1);
      return;
    }
    ovDn = 0;
    nudge(e.deltaY / WHEEL_STEP);
  }, { passive: false });

  // 상단 메뉴(시선·사람·공간) 클릭 → 해당 패널로
  [].slice.call(document.querySelectorAll(".hl-menu a[data-go]")).forEach(function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); setPanel(Number(a.dataset.go)); });
  });

  axis.forEach(function (b) {
    b.addEventListener("click", function () { go(Number(b.dataset.jump)); });
  });

  /* ---------- 커서 — 지금 갈 수 있는 방향을 알린다 (원본 규칙) ---------- */
  var mouseY = null;

  function cursor() {
    var i = Math.round(pos);
    var canUp = i > 0;
    var canDown = i < n - 1;
    var state = "updown";

    if (!canUp)        state = "down";
    else if (!canDown) state = "up";
    else if (mouseY !== null) {
      // 화면 위쪽에 있으면 위로, 아래쪽에 있으면 아래로
      state = mouseY < window.innerHeight / 2 ? "up" : "down";
    }
    stage.dataset.cursor = state;
  }

  window.addEventListener("mousemove", function (e) {
    mouseY = e.clientY;
    cursor();
  }, { passive: true });

  /* ---------- 크게 보기 ---------- */
  // 화면에 나온 순서대로 묶음별 목록을 만든다 (왼쪽 → 오른쪽)
  var sets = {};
  for (var i = 0; i < n; i++) {
    [lSlides[i], rSlides[i]].forEach(function (s) {
      var g = s.dataset.group;
      var img = s.querySelector("img");
      (sets[g] = sets[g] || []).push({ src: img.getAttribute("src"), alt: img.getAttribute("alt") });
      img.dataset.set = g;
      img.dataset.pos = sets[g].length - 1;
    });
  }

  var cur = { set: null, pos: 0 };
  var lastFocus = null;

  function strip(setName, pos) {
    vStrip.textContent = "";
    sets[setName].forEach(function (item, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "viewer__thumb";
      b.setAttribute("aria-current", i === pos ? "true" : "false");
      b.setAttribute("aria-label", item.alt);
      var t = document.createElement("img");
      t.src = item.src;
      t.alt = "";
      b.appendChild(t);
      b.addEventListener("click", function () { show(setName, i); });
      vStrip.appendChild(b);
    });
  }

  function show(setName, pos) {
    var list = sets[setName];
    pos = (pos + list.length) % list.length;
    cur.set = setName;
    cur.pos = pos;
    vImg.src = list[pos].src;
    vImg.alt = list[pos].alt;
    vCap.textContent = setName + " " + (pos + 1) + " / " + list.length;
    strip(setName, pos);
  }

  function open(setName, pos, trigger) {
    lastFocus = trigger || null;
    show(setName, pos);
    viewer.dataset.open = "true";
    btnClose.focus();
  }

  function close() {
    viewer.dataset.open = "false";
    vImg.src = "";
    if (lastFocus) lastFocus.focus();
  }

  [].slice.call(document.querySelectorAll(".frame__btn")).forEach(function (btn) {
    btn.addEventListener("click", function () {
      var img = btn.querySelector("img");
      open(img.dataset.set, Number(img.dataset.pos), btn);
    });
  });

  btnPrev.addEventListener("click", function () { show(cur.set, cur.pos - 1); });
  btnNext.addEventListener("click", function () { show(cur.set, cur.pos + 1); });
  btnClose.addEventListener("click", close);

  /* ---------- 키보드 (원본에는 없음 · 접근성으로 추가) ---------- */
  document.addEventListener("keydown", function (e) {
    if (viewer.dataset.open === "true") {
      if (e.key === "Escape")     close();
      if (e.key === "ArrowLeft")  show(cur.set, cur.pos - 1);
      if (e.key === "ArrowRight") show(cur.set, cur.pos + 1);
      return;
    }
    if (panel !== 0) return;   // 사람·공간에선 각 iframe이 키보드를 처리
    if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); if (Math.round(pos) >= n - 1) { setPanel(1); } else { go(Math.round(pos) + 1); } }
    if (e.key === "ArrowUp"   || e.key === "PageUp")   { e.preventDefault(); go(Math.round(pos) - 1); }
    if (e.key === "Home") { e.preventDefault(); go(0); }
    if (e.key === "End")  { e.preventDefault(); go(n - 1); }
  });

  apply();
  cursor();

  // 원본 .initialised — 준비되면 무대를 드러낸다.
  // rAF 는 탭이 백그라운드면 안 돌아서, 타이머로도 한 번 더 켠다
  function ready() { stage.dataset.ready = "true"; }
  requestAnimationFrame(ready);
  setTimeout(ready, 100);
})();
</script>

</body>
</html>
